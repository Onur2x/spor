<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitPro - Antrenman Defteri</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d9534f">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { 
      --primary: #d9534f; --accent: #0275d8; --success: #28a745;
      --bg: #f4f6f8; --card-bg: #ffffff; --text: #2c3e50; --border: #edf2f7; --input-bg: #ffffff;
    }
    body.dark-theme {
      --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --border: #333333; --input-bg: #2d2d2d;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 12px; padding-bottom: 120px; transition: background 0.3s; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; }
    h1 { color: var(--primary); font-size: 1.4rem; margin: 0; }
    .subtitle { font-size: 0.8rem; color: #7f8c8d; margin-bottom: 12px; }
    .theme-toggle { background: var(--border); border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; color: var(--text); font-weight: bold; }
    
    .tab-container { display: flex; gap: 6px; margin-bottom: 15px; overflow-x: auto; }
    .tab-btn { flex: 1; padding: 10px 6px; background: var(--border); border: none; border-radius: 8px; font-weight: bold; font-size: 0.75rem; color: var(--text); cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: var(--primary); color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid var(--border); }
    h2 { color: var(--accent); font-size: 1.1rem; border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-top: 0; }

    .ex-list { list-style: none; padding: 0; margin: 0; }
    .ex-item { border-bottom: 1px solid var(--border); padding: 12px 0; }
    .ex-title { font-weight: 700; font-size: 0.95rem; }
    .actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    
    .btn { border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; text-decoration: none; }
    .btn-timer { background: #ebf8ff; color: var(--accent); border: 1px solid #bee3f8; }
    .btn-db { background: #fff5f5; color: var(--primary); border: 1px solid #fed7d7; }
    .btn-mac { background: #f0fff4; color: var(--success); border: 1px solid #c6f6d5; }
    .btn-finish { background: var(--success); color: white; width: 100%; padding: 12px; font-size: 0.95rem; border-radius: 8px; margin-top: 10px; font-weight: bold;}

    .set-table { width: 100%; margin-top: 8px; border-collapse: collapse; font-size: 0.78rem; }
    .set-table th { color: #718096; font-weight: 600; text-align: center; }
    .set-table td { text-align: center; padding: 3px 0; }
    .set-input { width: 45px; padding: 4px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); border-radius: 5px; text-align: center; }
    .set-type-btn { font-size: 0.65rem; padding: 2px 5px; border-radius: 4px; background: var(--border); color: var(--text); border: none; }

    /* Visual Barbell Visualizer */
    .barbell-display { display: flex; align-items: center; justify-content: center; height: 50px; background: var(--border); margin-top: 10px; border-radius: 8px; padding: 0 10px; }
    .bar-shaft { height: 8px; background: #a0aec0; flex-grow: 1; border-radius: 4px; }
    .plate { display: inline-block; margin: 0 1px; border-radius: 3px; color: white; font-size: 0.6rem; font-weight: bold; text-align: center; line-height: 35px; }
    .p20 { width: 12px; height: 40px; background: #e53e3e; }
    .p10 { width: 10px; height: 32px; background: #3182ce; }
    .p5 { width: 8px; height: 24px; background: #38a169; }
    .p25 { width: 6px; height: 18px; background: #d69e2e; }

    #timer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a202c; color: white; padding: 10px 15px; display: none; justify-content: space-between; align-items: center; z-index: 1000; }
    #timer-display { font-size: 1.2rem; font-weight: bold; color: #48bb78; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>FITPRO PRO</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 Mod</button>
  </div>
  <div class="subtitle">Profesyonel Antrenman & İlerleme Asistanı</div>

  <div class="tab-container">
    <button class="tab-btn active" onclick="switchTab('day1', event)">1. GÜN: İTİŞ</button>
    <button class="tab-btn" onclick="switchTab('day2', event)">2. GÜN: ÇEKİŞ/BACAK</button>
    <button class="tab-btn" onclick="switchTab('analytics', event)">📊 ANALİZ</button>
    <button class="tab-btn" onclick="switchTab('tools', event)">🛠 ARAÇLAR</button>
  </div>

  <!-- GÜN 1 -->
  <div id="day1" class="tab-content active">
    <div class="card">
      <h2>1. GÜN: İTİŞ (Göğüs, Omuz, Arka Kol)</h2>
      <button class="btn btn-timer" style="width:100%; margin-bottom:10px;" onclick="startVoiceInput('ex1')">🎙️ Sesli Set Kaydı Başlat</button>
      <ul class="ex-list">
        <script>
          const day1Exercises = [
            { id: "ex1", title: "1. Düz Göğüs Pres (Bench Press)", timer: 90 },
            { id: "ex2", title: "2. Üst Göğüs Pres (Incline Press)", timer: 90 },
            { id: "ex3", title: "3. Göğüs Sıkıştırma (Pec Deck Fly)", timer: 60 },
            { id: "ex4", title: "4. Omuz Pres (Shoulder Press)", timer: 90 },
            { id: "ex5", title: "5. Yana Omuz Açış (Lateral Raise)", timer: 60 },
            { id: "ex6", title: "6. Arka Omuz Çekiş (Face Pull)", timer: 60 },
            { id: "ex7", title: "7. Arka Kol İtiş (Triceps Pushdown)", timer: 60 }
          ];

          function renderEx(ex) {
            return `
              <li class="ex-item">
                <div class="ex-title">${ex.title}</div>
                <div class="actions">
                  <button class="btn btn-timer" onclick="startTimer(${ex.timer})">⏱ ${ex.timer}sn</button>
                </div>
                <table class="set-table">
                  <tr><th>Set</th><th>Tür</th><th>kg</th><th>Tekrar</th><th>RIR</th></tr>
                  ${[1,2,3].map(s => `
                    <tr>
                      <td>${s}. Set</td>
                      <td><button class="set-type-btn" id="${ex.id}-s${s}-type" onclick="cycleSetType('${ex.id}-s${s}-type')">Normal</button></td>
                      <td><input type="number" class="set-input" id="${ex.id}-s${s}-w" onchange="saveData()"></td>
                      <td><input type="number" class="set-input" id="${ex.id}-s${s}-r" placeholder="10" onchange="saveData()"></td>
                      <td><input type="number" class="set-input" id="${ex.id}-s${s}-rir" placeholder="1" min="0" max="4"></td>
                    </tr>
                  `).join('')}
                </table>
              </li>
            `;
          }
          day1Exercises.forEach(ex => document.write(renderEx(ex)));
        </script>
      </ul>
      <button class="btn btn-finish" onclick="completeWorkout('İtiş')">✅ Antrenmanı Bitir & Hacmi Kaydet</button>
    </div>
  </div>

  <!-- GÜN 2 -->
  <div id="day2" class="tab-content">
    <div class="card">
      <h2>2. GÜN: ÇEKİŞ & BACAK</h2>
      <ul class="ex-list">
        <script>
          const day2Exercises = [
            { id: "ex8", title: "1. Lat Pulldown", timer: 90 },
            { id: "ex9", title: "2. Seated Cable Row", timer: 90 },
            { id: "ex10", title: "3. Leg Press / Squat", timer: 90 },
            { id: "ex11", title: "4. Leg Extension", timer: 60 },
            { id: "ex12", title: "5. Biceps Curl", timer: 60 }
          ];
          day2Exercises.forEach(ex => document.write(renderEx(ex)));
        </script>
      </ul>
      <button class="btn btn-finish" onclick="completeWorkout('Çekiş & Bacak')">✅ Antrenmanı Bitir & Hacmi Kaydet</button>
    </div>
  </div>

  <!-- ANALİZ SEKMESİ -->
  <div id="analytics" class="tab-content">
    <div class="card">
      <h2>📈 Haftalık Toplam Hacim (kg)</h2>
      <canvas id="volumeChart" style="width:100%; max-height:220px;"></canvas>
    </div>
  </div>

  <!-- ARAÇLAR SEKMESİ -->
  <div id="tools" class="tab-content">
    <div class="card">
      <h2>🏋️ Görsel Plaka Hesaplayıcı</h2>
      <div style="display:flex; gap:8px;">
        <input type="number" id="target-weight" class="set-input" style="width:100px;" placeholder="Örn: 80">
        <button class="btn btn-timer" onclick="drawPlates()">Hesapla & Çiz</button>
      </div>
      <div class="barbell-display" id="barbell-container">
        <div class="bar-shaft"></div>
      </div>
      <div id="plate-text" style="font-size:0.75rem; margin-top:5px; text-align:center; opacity:0.8;">Bar: 20kg kabul edilir.</div>
    </div>
  </div>

  <div id="timer-bar">
    <div>
      <div style="font-size:0.7rem; color:#a0aec0;">DİNLENME</div>
      <div id="timer-display">00:00</div>
    </div>
    <button class="btn btn-db" onclick="stopTimer()">Kapat</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

    document.addEventListener("DOMContentLoaded", () => {
      loadData();
      initChart();
      if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-theme');
    });

    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
      localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
    }

    function switchTab(tabId, evt) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }

    function cycleSetType(id) {
      const btn = document.getElementById(id);
      const types = ["Normal", "Drop", "Süper"];
      btn.textContent = types[(types.indexOf(btn.textContent) + 1) % types.length];
      localStorage.setItem(id, btn.textContent);
    }

    /* Görsel Plaka Çizici */
    function drawPlates() {
      const target = parseFloat(document.getElementById('target-weight').value);
      const container = document.getElementById('barbell-container');
      const text = document.getElementById('plate-text');
      if (!target || target < 20) return;

      let sideWeight = (target - 20) / 2;
      const plates = [20, 10, 5, 2.5];
      let sidePlates = [];

      plates.forEach(p => {
        while (sideWeight >= p) {
          sidePlates.push(p);
          sideWeight -= p;
        }
      });

      let plateHTML = sidePlates.map(p => {
        let cls = p === 20 ? 'p20' : p === 10 ? 'p10' : p === 5 ? 'p5' : 'p25';
        return `<div class="plate ${cls}">${p}</div>`;
      }).join('');

      container.innerHTML = `<div style="display:flex; align-items:center;">${plateHTML}</div><div class="bar-shaft"></div><div style="display:flex; align-items:center;">${plateHTML}</div>`;
      text.textContent = `Tek taraf için plakalar: ${sidePlates.join('kg, ')}kg`;
    }

    /* Akıllı Sesli Komut Motoru */
    function startVoiceInput(exId) {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("Tarayıcınız sesli komutu desteklemiyor.");
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const rec = new SpeechRecognition();
      rec.lang = 'tr-TR';
      rec.start();
      alert("Konuşun! Örn: '80 kilo 10 tekrar'");

      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        const nums = text.match(/\d+/g);
        if (nums && nums.length >= 2) {
          document.getElementById(`${exId}-s1-w`).value = nums[0];
          document.getElementById(`${exId}-s1-r`).value = nums[1];
          saveData();
          alert(`Kaydedildi: ${nums[0]}kg x ${nums[1]} tekrar`);
        }
      };
    }

    /* Dinlenme Sayacı & Sesli Geri Sayım */
    let timerInterval;
    function startTimer(sec) {
      clearInterval(timerInterval);
      const display = document.getElementById('timer-display');
      document.getElementById('timer-bar').style.display = 'flex';
      let timeLeft = sec;

      timerInterval = setInterval(() => {
        timeLeft--;
        display.textContent = timeLeft + " sn";

        if (timeLeft <= 3 && timeLeft > 0) speakText(timeLeft.toString());
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          display.textContent = "Süre Bitti! 🔥";
          speakText("Dinlenme bitti, sonraki sete geç!");
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      document.getElementById('timer-bar').style.display = 'none';
    }

    function speakText(txt) {
      if ('speechSynthesis' in window) {
        const msg = new SpeechSynthesisUtterance(txt);
        msg.lang = 'tr-TR';
        window.speechSynthesis.speak(msg);
      }
    }

    /* Grafik & Veri Takibi */
    function completeWorkout(dayName) {
      let totalVolume = 0;
      document.querySelectorAll('.set-input[id$="-w"]').forEach(input => {
        let idBase = input.id.replace('-w', '');
        let w = parseFloat(input.value) || 0;
        let r = parseFloat(document.getElementById(`${idBase}-r`)?.value) || 0;
        totalVolume += (w * r);
      });

      let history = JSON.parse(localStorage.getItem('volHistory') || '[]');
      const dateLabel = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
      history.push({ date: dateLabel, volume: totalVolume });
      if (history.length > 7) history.shift();
      localStorage.setItem('volHistory', JSON.stringify(history));

      alert(`Tebrikler! 🎉 Antrenman bitti. Toplam Hacim: ${totalVolume} kg`);
      location.reload();
    }

    function initChart() {
      const ctx = document.getElementById('volumeChart')?.getContext('2d');
      if (!ctx) return;
      const history = JSON.parse(localStorage.getItem('volHistory') || '[]');
      
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: history.map(h => h.date),
          datasets: [{
            label: 'Toplam Hacim (kg)',
            data: history.map(h => h.volume),
            borderColor: '#d9534f',
            backgroundColor: 'rgba(217, 83, 79, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    function saveData() {
      document.querySelectorAll('.set-input').forEach(i => localStorage.setItem(i.id, i.value));
    }
    function loadData() {
      document.querySelectorAll('.set-input').forEach(i => {
        if (localStorage.getItem(i.id) !== null) i.value = localStorage.getItem(i.id);
      });
    }
  </script>
</body>
</html>
