<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitPro CLOUD - Özel Spor Platformu</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d9534f">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root { 
      --primary: #d9534f; --accent: #0275d8; --success: #28a745;
      --warning: #f0ad4e; --purple: #6f42c1; --bg: #f4f6f8; 
      --card-bg: #ffffff; --text: #2c3e50; --border: #edf2f7; --input-bg: #ffffff;
    }
    body.dark-theme {
      --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0;
      --border: #333333; --input-bg: #2d2d2d;
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: var(--bg); color: var(--text); margin: 0; padding: 12px; 
      padding-bottom: 120px; transition: background 0.3s, color 0.3s;
    }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { color: var(--primary); font-size: 1.4rem; margin: 0; }
    .theme-toggle { background: var(--border); border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; color: var(--text); font-weight: bold; font-size: 0.8rem; }
    
    /* GİRİŞ EKRANI KARTI */
    .auth-card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin: 20px auto; border: 1px solid var(--border); text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 350px; }
    .auth-input { width: 90%; padding: 10px; margin: 6px 0; border: 1px solid var(--border); border-radius: 6px; background: var(--input-bg); color: var(--text); font-size: 0.9rem; }

    /* UYGULAMA İÇERİĞİ (GİRİŞ YAPILMADAN GİZLENİR) */
    #app-content { display: none; }

    .user-level-card { background: linear-gradient(135deg, #6f42c1, #a855f7); color: white; border-radius: 12px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 12px rgba(111, 66, 193, 0.3); }
    .level-badge { background: #fff; color: #6f42c1; font-weight: bold; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; }
    .xp-bar-bg { width: 100%; background: rgba(255,255,255,0.2); height: 8px; border-radius: 4px; margin-top: 6px; overflow: hidden; }
    .xp-bar-fill { height: 100%; background: #4ade80; width: 0%; transition: width 0.5s; }

    .workout-timer-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    .tab-container { display: flex; gap: 6px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px 8px; background: var(--border); border: none; border-radius: 8px; font-weight: bold; font-size: 0.75rem; color: var(--text); cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid var(--border); }
    h2 { color: var(--accent); font-size: 1.1rem; border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-top: 0; }

    .ex-list { list-style: none; padding: 0; margin: 0; }
    .ex-item { border-bottom: 1px solid var(--border); padding: 12px 0; }
    .ex-header { display: flex; justify-content: space-between; align-items: center; }
    .ex-title { font-weight: 700; font-size: 0.95rem; }

    .actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .btn { border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-timer { background: #ebf8ff; color: var(--accent); border: 1px solid #bee3f8; }
    .btn-db { background: #fff5f5; color: var(--primary); border: 1px solid #fed7d7; }
    .btn-mac { background: #28a745; color: white; }
    .btn-yt { background: #fff0f0; color: #c00; border: 1px solid #ffcdd2; }
    .btn-delete-ex { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; font-size: 0.65rem; }
    .btn-new-ex { background: var(--accent); color: white; width: 100%; padding: 10px; font-size: 0.85rem; border-radius: 8px; margin-top: 10px; font-weight: bold; }
    .btn-finish { background: var(--success); color: white; width: 100%; padding: 12px; font-size: 0.95rem; border-radius: 8px; margin-top: 10px; font-weight: bold;}

    .set-table { width: 100%; margin-top: 8px; border-collapse: collapse; font-size: 0.78rem; }
    .set-table th { color: #718096; font-weight: 600; text-align: center; padding-bottom: 4px; }
    .set-table td { text-align: center; padding: 3px 0; }
    .set-input { width: 50px; padding: 5px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); border-radius: 5px; text-align: center; }
    .set-check { width: 20px; height: 20px; accent-color: var(--success); cursor: pointer; }

    .gif-container { display: none; margin-top: 8px; text-align: center; background: var(--card-bg); padding: 8px; border-radius: 8px; border: 1px solid var(--border); }
    .gif-container img { max-width: 100%; height: auto; max-height: 200px; border-radius: 6px; }

    #timer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a202c; color: white; padding: 10px 15px; display: none; justify-content: space-between; align-items: center; z-index: 1000; }
    #timer-display { font-size: 1.2rem; font-weight: bold; color: #48bb78; }
    .user-info-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border); }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>FITPRO CLOUD</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 Mod</button>
  </div>

  <!-- GİRİŞ EKRANI (GİRİŞ YAPILMAMIŞSA SADECE BU GÖRÜNÜR) -->
  <div class="auth-card" id="auth-section">
    <h2 style="margin:0 0 10px 0; color:var(--primary); border:none;">Giriş Yap</h2>
    <p style="font-size:0.8rem; color:#7f8c8d; margin-top:0;">Antrenmanlarınıza erişmek için hesabınıza giriş yapın.</p>
    <input type="email" id="auth-email" class="auth-input" placeholder="E-posta Adresi"><br>
    <input type="password" id="auth-password" class="auth-input" placeholder="Şifre"><br>
    <div style="display:flex; gap:8px; justify-content:center; margin-top:10px;">
      <button class="btn btn-timer" onclick="handleSignIn()" style="flex:1;">Giriş Yap</button>
      <button class="btn btn-mac" onclick="handleSignUp()" style="flex:1;">Kayıt Ol</button>
    </div>
  </div>

  <!-- UYGULAMA İÇERİĞİ (GİRİŞ YAPILINCA AÇILIR) -->
  <div id="app-content">
    
    <!-- KULLANICI BİLGİ VE ÇIKIŞ BARI -->
    <div class="user-info-bar">
      <span style="font-size:0.8rem;">👤 <strong id="user-email-display" style="color:var(--accent);"></strong></span>
      <button class="btn btn-db" onclick="handleSignOut()">🚪 Çıkış Yap</button>
    </div>

    <!-- LEVEL & XP -->
    <div class="user-level-card">
      <div style="flex:1;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-right:10px;">
          <span style="font-size:0.85rem; font-weight:bold;">Seviye İlerlemesi</span>
          <span class="level-badge" id="user-level">LVL 1</span>
        </div>
        <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-fill"></div></div>
        <div style="font-size:0.65rem; margin-top:3px; opacity:0.9;" id="xp-text">0 / 100 XP</div>
      </div>
    </div>

    <!-- KRONOMETRE -->
    <div class="workout-timer-box">
      <div>
        <span style="font-size:0.75rem; opacity:0.8;">Antrenman Süresi:</span>
        <strong id="workout-timer" style="font-size:1.1rem; color:var(--accent); display:block;">00:00:00</strong>
      </div>
      <button id="toggle-workout-btn" class="btn btn-mac" onclick="toggleWorkoutTimer()">▶️ Başlat</button>
    </div>

    <!-- TABS -->
    <div class="tab-container">
      <button class="tab-btn active" onclick="switchTab('day1', event)">1. GÜN: İTİŞ</button>
      <button class="tab-btn" onclick="switchTab('day2', event)">2. GÜN: ÇEKİŞ & BACAK</button>
    </div>

    <!-- 1. GÜN -->
    <div id="day1" class="tab-content active">
      <div class="card">
        <h2>1. GÜN: İTİŞ (Göğüs, Omuz, Arka Kol)</h2>
        <ul class="ex-list" id="day1-list"></ul>
        <button class="btn btn-new-ex" onclick="addNewExercisePrompt('day1')">➕ Resimli/GIF'li Egzersiz Ekle</button>
        <button class="btn btn-finish" onclick="finishWorkout()">🏁 Antrenmanı Tamamla (+50 XP)</button>
      </div>
    </div>

    <!-- 2. GÜN -->
    <div id="day2" class="tab-content">
      <div class="card">
        <h2>2. GÜN: ÇEKİŞ & BACAK (Sırt, Bacak, Ön Kol, Karın)</h2>
        <ul class="ex-list" id="day2-list"></ul>
        <button class="btn btn-new-ex" onclick="addNewExercisePrompt('day2')">➕ Resimli/GIF'li Egzersiz Ekle</button>
        <button class="btn btn-finish" onclick="finishWorkout()">🏁 Antrenmanı Tamamla (+50 XP)</button>
      </div>
    </div>

  </div>

  <!-- DİNLENME BAR -->
  <div id="timer-bar">
    <div>
      <div style="font-size:0.7rem; color:#a0aec0;">DİNLENME SÜRESİ</div>
      <div id="timer-display">00:00</div>
    </div>
    <button class="btn btn-db" onclick="stopTimer()">Kapat</button>
  </div>

  <script>
    const SUPABASE_URL = "https://mbmzxmogkydyotfdajim.supabase.co";
    const SUPABASE_KEY = "sb_publishable_xwY6oGTchcUV4GR2P-vKyQ_DdhrYeIm";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let allExercises = [];
    let userXP = 0;
    let userLevel = 1;
    let workoutTimerInterval = null;
    let workoutSeconds = 0;
    let isWorkoutRunning = false;
    let restTimerInterval = null;

    document.addEventListener("DOMContentLoaded", async () => {
      await checkUserSession();
    });

    /* OTURUM KONTROLÜ VE EKRAN KİLİDİ */
    async function checkUserSession() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      currentUser = user;
      
      const authSection = document.getElementById('auth-section');
      const appContent = document.getElementById('app-content');

      if (currentUser) {
        // Kullanıcı giriş yaptıysa: Giriş panelini gizle, Uygulamayı aç
        authSection.style.display = 'none';
        appContent.style.display = 'block';
        document.getElementById('user-email-display').textContent = currentUser.email;
        
        await loadUserProfile();
        await fetchExercisesFromSupabase();
      } else {
        // Giriş yapılmadıysa: Uygulamayı gizle, Giriş panelini göster
        authSection.style.display = 'block';
        appContent.style.display = 'none';
        userXP = 0; userLevel = 1;
      }
    }

    async function loadUserProfile() {
      if (!currentUser) return;
      let { data, error } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
      
      if (!data) {
        await supabaseClient.from('profiles').insert([{ id: currentUser.id, email: currentUser.email, xp: 0, level: 1 }]);
        userXP = 0; userLevel = 1;
      } else {
        userXP = data.xp || 0;
        userLevel = data.level || 1;
      }
      updateLevelUI();
    }

    /* SUPABASE'DEN EGZERSİZLERİ ÇEKME */
    async function fetchExercisesFromSupabase() {
      const { data, error } = await supabaseClient.from('exercises').select('*');
      if (error) { console.error("Egzersiz yükleme hatası:", error); return; }
      allExercises = data || [];
      renderAllExercises();
    }

    function renderAllExercises() {
      const day1List = document.getElementById('day1-list');
      const day2List = document.getElementById('day2-list');
      
      const day1Ex = allExercises.filter(e => e.day_type === 'day1');
      const day2Ex = allExercises.filter(e => e.day_type === 'day2');

      day1List.innerHTML = day1Ex.map(ex => renderExHTML(ex)).join('');
      day2List.innerHTML = day2Ex.map(ex => renderExHTML(ex)).join('');
    }

    function renderExHTML(ex) {
      return `
        <li class="ex-item" id="item-${ex.id}">
          <div class="ex-header">
            <div class="ex-title">${ex.title}</div>
            <button class="btn btn-delete-ex" onclick="deleteExercise('${ex.id}')">🗑️ Sil</button>
          </div>
          <div class="actions">
            <button class="btn btn-timer" onclick="startTimer(${ex.timer})">⏱️ ${ex.timer}s Dinlen</button>
            <button class="btn btn-yt" onclick="openYouTube('${ex.title}')">▶️ YouTube</button>
            ${ex.gif_url ? `<button class="btn btn-db" onclick="toggleGif('${ex.id}')">🖼️ Resim/GIF</button>` : ''}
          </div>
          ${ex.gif_url ? `<div class="gif-container" id="gif-${ex.id}"><img src="${ex.gif_url}" alt="Rehber Visual"></div>` : ''}
          <table class="set-table">
            <thead><tr><th>Ağırlık (kg)</th><th>Tekrar</th><th>Tamam</th></tr></thead>
            <tbody>
              <tr>
                <td><input type="number" class="set-input weight-input" placeholder="0"></td>
                <td><input type="number" class="set-input reps-input" placeholder="0"></td>
                <td><input type="checkbox" class="set-check" onchange="onSetCompleted(this, '${ex.id}', '${ex.title}')"></td>
              </tr>
            </tbody>
          </table>
        </li>
      `;
    }

    /* AUTH İŞLEMLERİ */
    async function handleSignUp() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      if (!email || !password) return alert("Lütfen e-posta ve şifre girin!");

      const { error } = await supabaseClient.auth.signUp({ email, password });
      if (error) alert("Kayıt Hatası: " + error.message);
      else {
        alert("✅ Kayıt başarılı! Oturum açılıyor...");
        await handleSignIn();
      }
    }

    async function handleSignIn() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      if (!email || !password) return alert("Lütfen e-posta ve şifre girin!");

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert("Giriş Hatası: " + error.message);
      else await checkUserSession();
    }

    async function handleSignOut() {
      await supabaseClient.auth.signOut();
      await checkUserSession();
    }

    /* DİĞER FONKSİYONLAR */
    async function onSetCompleted(checkbox, exId, exTitle) {
      if (checkbox.checked && currentUser) {
        let row = checkbox.closest('tr');
        let weight = parseFloat(row.querySelector('.weight-input').value) || 0;
        let reps = parseInt(row.querySelector('.reps-input').value) || 0;

        await supabaseClient.from('workout_logs').insert([{
          user_id: currentUser.id, exercise_id: exId, exercise_title: exTitle, weight: weight, reps: reps
        }]);
        await addXP(10);
      }
    }

    async function addNewExercisePrompt(dayTag) {
      let title = prompt("Egzersiz Adını Girin:");
      if (!title) return;
      let gifUrl = prompt("Egzersiz Resim veya GIF Linki (İsteğe bağlı):") || "";
      let timerVal = parseInt(prompt("Dinlenme Süresi (Saniye):", "60")) || 60;

      let newId = "custom_" + Date.now();
      const { error } = await supabaseClient.from('exercises').insert([{
        id: newId, title: title, day_type: dayTag, timer: timerVal, gif_url: gifUrl, user_id: currentUser ? currentUser.id : null
      }]);

      if (error) alert("Hata: " + error.message);
      else await fetchExercisesFromSupabase();
    }

    async function deleteExercise(exId) {
      if (!confirm("Bu egzersizi silmek istediğinize emin misiniz?")) return;
      const { error } = await supabaseClient.from('exercises').delete().eq('id', exId);
      if (error) alert("Silme Hatası: " + error.message);
      else await fetchExercisesFromSupabase();
    }

    async function addXP(amount) {
      userXP += amount;
      let needed = userLevel * 100;
      if (userXP >= needed) {
        userXP -= needed; userLevel++;
        alert(`🎉 TEBRİKLER! LEVEL ${userLevel} OLDU!`);
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }
      updateLevelUI();
      if (currentUser) {
        await supabaseClient.from('profiles').update({ xp: userXP, level: userLevel }).eq('id', currentUser.id);
      }
    }

    function updateLevelUI() {
      document.getElementById('user-level').textContent = `LVL ${userLevel}`;
      let needed = userLevel * 100;
      let pct = (userXP / needed) * 100;
      document.getElementById('xp-fill').style.width = `${pct}%`;
      document.getElementById('xp-text').textContent = `${userXP} / ${needed} XP`;
    }

    function toggleGif(exId) {
      let el = document.getElementById(`gif-${exId}`);
      if (el) el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function openYouTube(term) {
      window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(term + " yapılışı")}`, '_blank');
    }

    function startTimer(seconds) {
      clearInterval(restTimerInterval);
      let left = seconds;
      document.getElementById('timer-bar').style.display = 'flex';
      updateTimerDisplay(left);
      restTimerInterval = setInterval(() => {
        left--; updateTimerDisplay(left);
        if (left <= 0) { clearInterval(restTimerInterval); alert("⏱️ Dinlenme Süresi Bitti!"); stopTimer(); }
      }, 1000);
    }

    function updateTimerDisplay(s) {
      let m = Math.floor(s / 60), sec = s % 60;
      document.getElementById('timer-display').textContent = `${m < 10 ? '0':''}${m}:${sec < 10 ? '0':''}${sec}`;
    }

    function stopTimer() { clearInterval(restTimerInterval); document.getElementById('timer-bar').style.display = 'none'; }

    function toggleWorkoutTimer() {
      let btn = document.getElementById('toggle-workout-btn');
      if (!isWorkoutRunning) {
        isWorkoutRunning = true; btn.textContent = "⏸️ Duraklat";
        workoutTimerInterval = setInterval(() => {
          workoutSeconds++;
          let h = Math.floor(workoutSeconds / 3600), m = Math.floor((workoutSeconds % 3600) / 60), s = workoutSeconds % 60;
          document.getElementById('workout-timer').textContent = `${h < 10 ? '0':''}${h}:${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;
        }, 1000);
      } else {
        isWorkoutRunning = false; btn.textContent = "▶️ Devam Et"; clearInterval(workoutTimerInterval);
      }
    }

    function switchTab(tabId, event) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    function toggleTheme() { document.body.classList.toggle('dark-theme'); }
    async function finishWorkout() { await addXP(50); confetti({ particleCount: 150 }); alert("🔥 Antrenman Tamamlandı!"); }
  </script>
</body>
</html>
